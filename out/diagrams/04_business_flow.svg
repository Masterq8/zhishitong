<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6FAFF"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F6BFF"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>

  <text x="600" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1F3A93">端到端审批业务流</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#6B7A90">从学生输入一句话到审批完成通知归档的完整链路——真实系统运行验证</text>

  <!-- Flow nodes arranged in a horizontal pipeline with details below -->

  <!-- Node 1: Student Input -->
  <rect x="20" y="85" width="160" height="65" rx="10" fill="#FFF" stroke="#2F6BFF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6BFF">① 学生输入</text>
  <text x="100" y="130" text-anchor="middle" font-size="10" fill="#6B7A90">自然语言描述需求</text>
  <text x="100" y="145" text-anchor="middle" font-size="9" fill="#8B9AB0">「我导师叫我去滨州</text>

  <!-- Arrow -->
  <line x1="180" y1="117" x2="208" y2="117" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Node 2: AI Intent -->
  <rect x="215" y="85" width="160" height="65" rx="10" fill="#FFF" stroke="#7C6BFF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="295" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#7C6BFF">② AI 意图识别</text>
  <text x="295" y="130" text-anchor="middle" font-size="10" fill="#6B7A90">云端 LLM 语义分析</text>
  <text x="295" y="145" text-anchor="middle" font-size="9" fill="#8B9AB0">→ 请假申请 (置信度 60%)</text>

  <line x1="375" y1="117" x2="403" y2="117" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Node 3: Field Extraction -->
  <rect x="410" y="85" width="160" height="65" rx="10" fill="#FFF" stroke="#7C6BFF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#7C6BFF">③ 字段抽取</text>
  <text x="490" y="130" text-anchor="middle" font-size="10" fill="#6B7A90">预填 12 个表单字段</text>
  <text x="490" y="145" text-anchor="middle" font-size="9" fill="#8B9AB0">时间/地点/事由/交通…</text>

  <line x1="570" y1="117" x2="598" y2="117" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Node 4: Compliance Check -->
  <rect x="605" y="85" width="170" height="65" rx="10" fill="#FFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#F59E0B">④ 合规自查</text>
  <text x="690" y="130" text-anchor="middle" font-size="10" fill="#6B7A90">RAG 检索 + 风险分析</text>
  <text x="690" y="145" text-anchor="middle" font-size="9" fill="#8B9AB0">低风险 · 4 条政策引用</text>

  <line x1="775" y1="117" x2="803" y2="117" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Node 5: Submit -->
  <rect x="810" y="85" width="140" height="65" rx="10" fill="#FFF" stroke="#22C55E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="880" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#22C55E">⑤ 提交审批</text>
  <text x="880" y="130" text-anchor="middle" font-size="10" fill="#6B7A90">创建审批记录</text>
  <text x="880" y="145" text-anchor="middle" font-size="9" fill="#8B9AB0">pending 状态</text>

  <line x1="950" y1="117" x2="978" y2="117" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Node 6: Approval -->
  <rect x="985" y="85" width="160" height="65" rx="10" fill="#FFF" stroke="#2F6BFF" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6BFF">⑥ 人工审批</text>
  <text x="1065" y="130" text-anchor="middle" font-size="10" fill="#6B7A90">AI 辅助 + 人工决策</text>
  <text x="1065" y="145" text-anchor="middle" font-size="9" fill="#8B9AB0">部门→财务→学校</text>

  <!-- === DETAIL SECTION === -->

  <line x1="600" y1="160" x2="600" y2="178" stroke="#2F6BFF" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="600" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A93">每个环节的证据与实现</text>

  <!-- Detail grid: 2 rows x 3 columns -->
  <!-- Row 1 -->
  <rect x="20" y="215" width="380" height="130" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <rect x="20" y="215" width="380" height="28" rx="10" fill="#2F6BFF"/>
  <rect x="20" y="233" width="380" height="10" fill="#2F6BFF"/>
  <text x="210" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">①-③ AI 填表证据链</text>
  <text x="40" y="265" font-size="11" fill="#1F3A93" font-weight="700">📝 输入：</text>
  <text x="40" y="283" font-size="10.5" fill="#6B7A90">「我导师叫我去滨州调研，我明后两天都不在学校，</text>
  <text x="40" y="299" font-size="10.5" fill="#6B7A90">我坐长途汽车去，帮我请个假」</text>
  <text x="40" y="320" font-size="11" fill="#1F3A93" font-weight="700">✅ 输出：</text>
  <text x="40" y="338" font-size="10.5" fill="#22C55E">12 字段预填：请假类型=公假 · 去向=滨州 · </text>
  <text x="40" y="354" font-size="10.5" fill="#22C55E">交通=长途汽车 · 时间=2026-06-05/06 · 置信度 60%</text>

  <rect x="410" y="215" width="380" height="130" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <rect x="410" y="215" width="380" height="28" rx="10" fill="#F59E0B"/>
  <rect x="410" y="233" width="380" height="10" fill="#F59E0B"/>
  <text x="600" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">④ 合规分析证据链</text>
  <text x="430" y="265" font-size="11" fill="#1F3A93" font-weight="700">⚖️ RAG 检索结果：</text>
  <text x="430" y="283" font-size="10.5" fill="#6B7A90">匹配 4 条政策条文（学生请假管理办法 2025）</text>
  <text x="430" y="302" font-size="11" fill="#1F3A93" font-weight="700">📊 逐项检查：</text>
  <text x="430" y="320" font-size="10.5" fill="#22C55E">✅ 请假事由已填写 · ✅ 材料类型匹配</text>
  <text x="430" y="338" font-size="10.5" fill="#F59E0B">⚠ 辅导员信息需补充</text>

  <rect x="800" y="215" width="380" height="130" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <rect x="800" y="215" width="380" height="28" rx="10" fill="#2F6BFF"/>
  <rect x="800" y="233" width="380" height="10" fill="#2F6BFF"/>
  <text x="990" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">⑤-⑥ 审批决策证据链</text>
  <text x="820" y="265" font-size="11" fill="#1F3A93" font-weight="700">🤖 AI 辅助面板：</text>
  <text x="820" y="283" font-size="10.5" fill="#6B7A90">合规分析 · 相似案例 · 政策引用 · 意见草稿</text>
  <text x="820" y="302" font-size="11" fill="#1F3A93" font-weight="700">👤 人工操作：</text>
  <text x="820" y="320" font-size="10.5" fill="#2F6BFF">通过 / 驳回 / 需修改 → 部门→财务→学校流转</text>
  <text x="820" y="340" font-size="10.5" fill="#6B7A90">审批意见模板一键填入 · 推荐按钮按风险高亮</text>

  <!-- === IMPLEMENTATION EVIDENCE === -->
  <text x="600" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A93">代码与数据证据</text>

  <rect x="20" y="390" width="580" height="115" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <text x="40" y="415" font-size="13" font-weight="700" fill="#1F3A93">后端实现</text>
  <text x="40" y="440" font-size="11" fill="#6B7A90">📁 rag_service.py (420 行) — TF-IDF 索引构建、政策检索、LLM 合规分析</text>
  <text x="40" y="458" font-size="11" fill="#6B7A90">📁 ocr_service.py — 多级 OCR 路由、JSON 填充、字段归一化映射</text>
  <text x="40" y="476" font-size="11" fill="#6B7A90">📁 approval_service.py — LangGraph 状态机、多阶段审批流程</text>
  <text x="40" y="494" font-size="11" fill="#6B7A90">📁 rule_engine.py — 硬性规则预审、正则兜底、金额阈值判断</text>

  <rect x="615" y="390" width="565" height="115" rx="10" fill="#FFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <text x="635" y="415" font-size="13" font-weight="700" fill="#1F3A93">前端实现</text>
  <text x="635" y="440" font-size="11" fill="#6B7A90">📁 WorkbenchPage.tsx — 自然语言输入 → AI 识别 → 预填展示</text>
  <text x="635" y="458" font-size="11" fill="#6B7A90">📁 ManualFormPage.tsx — 提交前合规自查按钮与结果展示</text>
  <text x="635" y="476" font-size="11" fill="#6B7A90">📁 AIDecisionPanel.tsx (362 行) — 合规分析+案例+条文+建议</text>
  <text x="635" y="494" font-size="11" fill="#6B7A90">📁 AuroraBackground.tsx — AI 调用时背景流体场聚合动效</text>

  <!-- === SCREENSHOT EVIDENCE === -->
  <rect x="20" y="520" width="1160" height="55" rx="10" fill="rgba(47,107,255,0.04)" stroke="#2F6BFF" stroke-width="1" stroke-dasharray="5,2"/>
  <text x="40" y="545" font-size="13" font-weight="700" fill="#2F6BFF">📸 截图证据（真实系统运行截图）</text>
  <text x="40" y="565" font-size="11" fill="#6B7A90">
    02_workbench_nl_prefill.png — 自然语言填表结果（12 字段 + 合规分析 + 4 条政策引用）
    · 04_dept_ai_review.png — 部门审批 AI 辅助面板
    · 05_notifications.png — 通知中心分类分页
    · 06_admin_monitor.png — 系统监控三面板
  </text>

  <!-- Bottom: Key insight -->
  <rect x="20" y="590" width="1160" height="32" rx="8" fill="rgba(34,197,94,0.06)"/>
  <text x="600" y="611" text-anchor="middle" font-size="12" fill="#22C55E" font-weight="700">
    💡 核心竞争力：不是「有 AI 功能」，而是 AI 深度嵌入审批全流程——填表 → 检索 → 合规 → 决策辅助 → 归档，每个环节有代码、有截图、可演示
  </text>
</svg>
